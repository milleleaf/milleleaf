name: Release

# A version tag (v0.1.0, ...) builds the mleaf command for Linux, macOS and Windows and creates a draft
# release with the archives, SHA-256 sums and build-provenance attestations. Publishing the draft is a
# person's decision. A manual run (workflow_dispatch) builds, signs and notarizes the same way but makes
# no release, to check the signing before a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, exe: mleaf }
          - { os: macos-15, target: aarch64-apple-darwin, exe: mleaf }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, exe: mleaf.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The signing secrets live in this environment, which only v* tags and main may use.
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev
      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: command -v cmake || brew install cmake
      - name: Tools (Windows)
        if: runner.os == 'Windows'
        # BoringSSL builds with cmake and NASM; bindgen needs libclang from the preinstalled LLVM.
        run: |
          choco install nasm --no-progress -y
          printf '%s\n' 'C:\Program Files\NASM' >> "$GITHUB_PATH"
          printf '%s\n' 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
      - name: Rust
        run: rustup toolchain install 1.98.0 --profile minimal && rustup default 1.98.0
      - name: Build
        run: cargo build --locked --release -p milleleaf-cli --bin mleaf
      - name: Sign and notarize (macOS)
        # Runs when the repository variable MACOS_SIGN is "true"; set it to anything else to build unsigned.
        if: runner.os == 'macOS' && vars.MACOS_SIGN == 'true'
        # Developer ID signature with the hardened runtime and a secure timestamp, then Apple's notary
        # service. A bare executable can't have the ticket stapled, so Gatekeeper fetches it online on
        # first run. The certificate goes into a throwaway keychain that the last step deletes.
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"; kpass=$(openssl rand -hex 24)
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kpass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          codesign --force --options runtime --timestamp --keychain "$keychain" -s "Developer ID Application" target/release/mleaf
          codesign --verify --strict --verbose=2 target/release/mleaf
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          ditto -c -k target/release/mleaf "$RUNNER_TEMP/mleaf-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/mleaf-notarize.zip" --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait --output-format json > "$RUNNER_TEMP/notary.json"
          rm -f "$RUNNER_TEMP/notary.p8"
          status=$(plutil -extract status raw "$RUNNER_TEMP/notary.json" 2>/dev/null || python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary.json")
          echo "notarization: $status"
          [ "$status" = Accepted ]
      - name: Remove the signing keychain (macOS)
        if: always() && runner.os == 'macOS' && vars.MACOS_SIGN == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
      - name: Package
        id: package
        run: |
          name="mleaf-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$name/examples" "$name/schema"
          cp "target/release/${{ matrix.exe }}" "$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE NOTICE "$name/"
          cp schema/office.mleaf.json "$name/schema/"
          cp -R examples/hello-table "$name/examples/"
          if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip "$name.zip" "$name" >/dev/null; echo "file=$name.zip" >> "$GITHUB_OUTPUT"
          else tar -czf "$name.tar.gz" "$name"; echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"; fi
      - name: Smoke test
        run: |
          cd "mleaf-${GITHUB_REF_NAME}-${{ matrix.target }}/examples/hello-table"
          ../../${{ matrix.exe }} validate project.mleaf.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.file }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes "Early release: see the README's Quickstart and milleleaf.com/status for what works and what doesn't. The macOS binary is signed and notarized. The Windows one isn't signed yet: run mleaf.exe from PowerShell or cmd. Check a download with: gh attestation verify <file> --repo $GITHUB_REPOSITORY" ./*
