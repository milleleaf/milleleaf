[workspace]
resolver = "3"
members = ["crates/milleleaf-core", "crates/milleleaf-cli", "crates/milleleaf-wordcraft", "crates/milleleaf-gridcraft", "crates/milleleaf-deckcraft", "crates/milleleaf-pack", "crates/milleleaf-odf", "crates/milleleaf-store", "crates/milleleaf-formats", "crates/milleleaf-seal", "crates/milleleaf-headers", "crates/milleleaf-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
milleleaf-core = { path = "crates/milleleaf-core" }
milleleaf-wordcraft = { path = "crates/milleleaf-wordcraft" }
milleleaf-gridcraft = { path = "crates/milleleaf-gridcraft" }
milleleaf-deckcraft = { path = "crates/milleleaf-deckcraft" }
milleleaf-pack = { path = "crates/milleleaf-pack" }
milleleaf-odf = { path = "crates/milleleaf-odf" }
milleleaf-store = { path = "crates/milleleaf-store" }
milleleaf-formats = { path = "crates/milleleaf-formats" }
milleleaf-seal = { path = "crates/milleleaf-seal" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"

# DeckCraft's PDF writer (through craft-pdf) needs the ArtCraft apps' patched krilla (github.com/storytold), as DeckCraft's own
# workspace does; WordCraft's PDF writer uses the same krilla 0.8.
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63", version = "=0.8.2" }

# Post-quantum signing runs about 30 times slower unoptimised (SLH-DSA: tens of seconds per
# signature in a debug build), and tests and run.sh sign often: optimise just these crates.
[profile.dev.package.ml-dsa]
opt-level = 3
[profile.dev.package.slh-dsa]
opt-level = 3
[profile.dev.package.fips205]
opt-level = 3
[profile.dev.package.module-lattice]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha3]
opt-level = 3
[profile.dev.package.keccak]
opt-level = 3
[profile.dev.package.shake]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.hybrid-array]
opt-level = 3
