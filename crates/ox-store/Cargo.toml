[package]
name = "ox-store"
description = "Milleleaf revision store: immutable layers by hash, compare-and-swap head, history, blame, checkpoints and detached signatures"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ox-core = { workspace = true }
ox-seal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
ed25519-dalek = "2"
getrandom = "0.2"
base64 = "0.22"
serde_json_canonicalizer = "=0.3.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
