[package]
name = "ox-store"
description = "Milleleaf revision store: immutable layers by hash, compare-and-swap head, history, blame, checkpoints and detached signatures"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ox-core = { workspace = true }
ox-seal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
ed25519-dalek = "2"
getrandom = "0.2"
base64 = "0.22"
serde_json_canonicalizer = "=0.3.2"
# Post-quantum signatures (plan decision 5, 18 Oct 2026).
# Pure Rust, never independently audited. ML-DSA: RustCrypto. SLH-DSA: fips205, a final release
#; one parameter set compiled in.
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc"] }
fips205 = { version = "=0.4.1", default-features = false, features = ["slh_dsa_sha2_192s"] }
# fips205's RNG traits (we hand it randomness drawn with getrandom).
rand_core = { version = "=0.6.4", default-features = false }
# RFC 3161 time-stamp requests and responses: our own types over `der` (a final release), no `cms`.
der = { version = "=0.8.2", features = ["alloc", "derive", "oid"] }

[dev-dependencies]
# RustCrypto SLH-DSA, a release candidate: only to cross-check fips205 in the tests.
slh-dsa = "=0.2.0-rc.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
