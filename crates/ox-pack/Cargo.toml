[package]
name = "ox-pack"
description = "Milleleaf pack: one composed snapshot → each part's PDF through its Craft app → one PDF assembled with PdfCraft"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ox-core = { workspace = true }
ox-wordcraft = { workspace = true }
ox-gridcraft = { workspace = true }
ox-deckcraft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# Same pins as the adapters; PdfCraft pinned on its own.
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "eae242176108d328c5dd81fbc10370c51ab90706" }
wordcraft-pdf = { git = "https://github.com/storytold/wordcraft", rev = "eae242176108d328c5dd81fbc10370c51ab90706" }
gridcraft-engine = { git = "https://github.com/storytold/gridcraft", rev = "f1894c6da64d4326022ae644c767581816a23c2c" }
deckcraft-pdf = { git = "https://github.com/storytold/deckcraft", rev = "1dc69720db64323370dda061226becb09ad79fd4" }
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft", rev = "924c4da4ac2879ac9107c6c82e20ac6be5570f0a" }
pdfcraft-edit = { git = "https://github.com/storytold/pdfcraft", rev = "924c4da4ac2879ac9107c6c82e20ac6be5570f0a" }
pdfcraft-organize = { git = "https://github.com/storytold/pdfcraft", rev = "924c4da4ac2879ac9107c6c82e20ac6be5570f0a" }
