[package]
name = "ox-pack"
description = "Milleleaf pack: one composed snapshot → each part's PDF through its Craft app → one PDF assembled with PdfCraft"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ox-core = { workspace = true }
ox-wordcraft = { workspace = true }
ox-gridcraft = { workspace = true }
ox-deckcraft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# Same pins as the adapters; PdfCraft pinned on its own.
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "fd0bb2fb1ec081e3eddc4d01917637fef0cafdfe" }
wordcraft-pdf = { git = "https://github.com/storytold/wordcraft", rev = "fd0bb2fb1ec081e3eddc4d01917637fef0cafdfe" }
gridcraft-engine = { git = "https://github.com/storytold/gridcraft", rev = "e6b6b349708ab4978cb3f061f6bd6ecbc25667cb" }
deckcraft-pdf = { git = "https://github.com/storytold/deckcraft", rev = "9859da39255c0262cd592bb57101d7f2fa961f72" }
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft", rev = "cdf44d7999fe80263feeae63ba1a5ade0d2d0c1d" }
pdfcraft-edit = { git = "https://github.com/storytold/pdfcraft", rev = "cdf44d7999fe80263feeae63ba1a5ade0d2d0c1d" }
pdfcraft-organize = { git = "https://github.com/storytold/pdfcraft", rev = "cdf44d7999fe80263feeae63ba1a5ade0d2d0c1d" }
