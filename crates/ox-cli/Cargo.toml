[package]
name = "ox-cli"
description = "ox command-line tool: compose, validate, inspect and render OX layer stacks"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ox"
path = "src/main.rs"

[dependencies]
ox-core = { workspace = true }
ox-wordcraft = { workspace = true }
ox-gridcraft = { workspace = true }
ox-deckcraft = { workspace = true }
ox-pack = { workspace = true }
ox-odf = { workspace = true }
ox-store = { workspace = true }
ox-formats = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zip = { version = "=3.0.0", default-features = false, features = ["deflate"] }
