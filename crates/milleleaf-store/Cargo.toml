[package]
name = "milleleaf-store"
description = "Milleleaf revision store: immutable layers by hash, compare-and-swap head, history, blame, checkpoints and detached signatures"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["boring"]
# Native sealed layers use BoringSSL; browsers use milleleaf-seal's pure-Rust implementation.
boring = ["milleleaf-seal/boring"]

[dependencies]
milleleaf-core = { workspace = true }
milleleaf-seal = { path = "../milleleaf-seal", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
ed25519-dalek = "2"
getrandom = "0.2"
base64 = "0.22"
serde_json_canonicalizer = "=0.3.2"
# Post-quantum signatures (plan decision 5, 18 Oct 2026).
# Pure Rust, never independently audited. ML-DSA: RustCrypto. SLH-DSA: fips205, a final release;
# one parameter set compiled in.
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc"] }
fips205 = { version = "=0.4.1", default-features = false, features = ["slh_dsa_sha2_192s"] }
# fips205's RNG traits (we hand it randomness drawn with getrandom).
rand_core = { version = "=0.6.4", default-features = false }
# RFC 3161 time-stamp requests and responses: our own types over `der` (a final release), no `cms`.
der = { version = "=0.8.2", features = ["alloc", "derive", "oid"] }
# RIPEMD-160 for 2015-era OpenTimestamps proofs (18 Oct 2026); digest 0.11, already in the tree.
ripemd = { version = "=0.2.0", default-features = false }

[dev-dependencies]
# RustCrypto SLH-DSA, a release candidate: only to cross-check fips205 in the tests.
slh-dsa = "=0.2.0-rc.5"

# Browser randomness is supplied by crypto.getRandomValues.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "=0.2.17", features = ["js"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
