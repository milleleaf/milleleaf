[package]
name = "milleleaf-pack"
description = "Milleleaf pack: one composed snapshot → each part's PDF through its Craft app → one PDF assembled with PdfCraft"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
milleleaf-core = { workspace = true }
milleleaf-wordcraft = { workspace = true }
milleleaf-gridcraft = { workspace = true }
milleleaf-deckcraft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# Same pins as the adapters; PdfCraft pinned on its own.
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "eae242176108d328c5dd81fbc10370c51ab90706" }
wordcraft-pdf = { git = "https://github.com/storytold/wordcraft", rev = "eae242176108d328c5dd81fbc10370c51ab90706" }
gridcraft-engine = { git = "https://github.com/storytold/gridcraft", rev = "8ffff19dda63d85348d4b4ec552b8857b82109b1" }
deckcraft-pdf = { git = "https://github.com/storytold/deckcraft", rev = "2cf4535c5d5f19f61094d20a5c8a8eaf6cdb8ec7" }
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft", rev = "bc7a12b94a7b67e1a051311eaed2155bc41290c9" }
pdfcraft-edit = { git = "https://github.com/storytold/pdfcraft", rev = "bc7a12b94a7b67e1a051311eaed2155bc41290c9" }
pdfcraft-organize = { git = "https://github.com/storytold/pdfcraft", rev = "bc7a12b94a7b67e1a051311eaed2155bc41290c9" }
