[package]
name = "milleleaf-web"
description = "Milleleaf browser adoption, comparison, loss inventory and signed layers"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
milleleaf-core.workspace = true
milleleaf-wordcraft = { path = "../milleleaf-wordcraft", default-features = false }
milleleaf-gridcraft.workspace = true
milleleaf-deckcraft.workspace = true
milleleaf-formats = { path = "../milleleaf-formats", default-features = false }
milleleaf-store = { path = "../milleleaf-store", default-features = false }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.129"
# Browser randomness for the existing signing implementations.
getrandom = { version = "=0.2.17", features = ["js"] }
zip = { version = "=3.0.0", default-features = false, features = ["deflate"] }
