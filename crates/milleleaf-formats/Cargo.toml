[package]
name = "milleleaf-formats"
description = "Milleleaf format registry: every way in and out of the model, what each keeps, and which one to use on this machine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["native"]
# LibreOffice and additional WordCraft writers need a native host.
native = ["dep:milleleaf-odf", "milleleaf-wordcraft/other-formats"]

[dependencies]
milleleaf-odf = { workspace = true, optional = true }
milleleaf-wordcraft = { path = "../milleleaf-wordcraft", default-features = false }
serde = { workspace = true }
thiserror = { workspace = true }
# Already in the build through the office crates (same versions); used to count what a file holds.
quick-xml = "=0.41.0"
zip = { version = "=3.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "eae242176108d328c5dd81fbc10370c51ab90706" }
